<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StayVista Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--brand:#6366f1;--green:#16a34a;--red:#dc2626;--amber:#d97706;--green-bg:#dcfce7;--red-bg:#fee2e2;--amber-bg:#fef3c7;--red-border:#fca5a5;--amber-border:#fde68a;--bg:#f8fafc;--bg2:#f1f5f9;--surface:#ffffff;--border:#e2e8f0;--radius:8px;--radius-sm:6px;--ink:#0f172a;--ink3:#64748b;--ink4:#94a3b8;}
html,body{height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;font-size:13px;color:var(--ink);}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;}
#app{display:none;flex-direction:column;height:100vh;}
.login-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:36px;width:380px;}
.login-title{font-size:18px;font-weight:600;margin-bottom:4px;}.login-sub{font-size:12px;color:var(--ink4);margin-bottom:24px;}
.role-tabs{display:flex;gap:4px;background:var(--bg2);border-radius:var(--radius);padding:3px;margin-bottom:20px;}
.role-tab{flex:1;font-size:11px;padding:7px;text-align:center;cursor:pointer;border:none;background:transparent;border-radius:6px;font-family:inherit;color:var(--ink4);}
.role-tab.on{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.login-group{display:none;}.login-group.on{display:block;}
.login-label{font-size:11px;color:var(--ink3);margin-bottom:5px;display:block;font-weight:500;}
.login-select,.login-input{width:100%;font-size:12px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);font-family:inherit;margin-bottom:12px;outline:none;}
.login-btn{width:100%;font-size:12px;padding:10px;border-radius:var(--radius-sm);border:none;background:var(--ink);color:white;cursor:pointer;font-weight:500;margin-top:4px;}
.login-err{font-size:11px;color:var(--red);margin-top:8px;display:none;}
#topbar{background:var(--ink);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:50px;flex-shrink:0;}
.tb-logo{font-size:14px;font-weight:600;color:white;}.tb-sub{font-size:10px;color:rgba(255,255,255,.4);}
.tb-nav{display:flex;gap:2px;background:rgba(255,255,255,.07);border-radius:6px;padding:3px;}
.nav-tab{font-size:11px;padding:5px 12px;border-radius:4px;color:rgba(255,255,255,.45);cursor:pointer;border:none;background:transparent;font-family:inherit;white-space:nowrap;}
.nav-tab.on{background:var(--brand);color:white;font-weight:500;}
.tb-right{display:flex;align-items:center;gap:10px;}
.tb-user{font-size:11px;color:rgba(255,255,255,.45);display:flex;align-items:center;gap:5px;}
.tb-dot{width:5px;height:5px;background:#22c55e;border-radius:50%;}
.tb-logout{font-size:11px;padding:4px 10px;border-radius:5px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.45);cursor:pointer;font-family:inherit;}
#content{flex:1;overflow-y:auto;padding:20px;}
.page{display:none;}.page.on{display:block;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.card-t{font-size:13px;font-weight:600;margin-bottom:4px;}.card-s{font-size:11px;color:var(--ink4);margin-bottom:10px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.kpi-lbl{font-size:11px;color:var(--ink4);margin-bottom:6px;}.kpi-val{font-size:24px;font-weight:700;color:var(--ink);margin-bottom:2px;}.kpi-sub{font-size:11px;color:var(--ink4);}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:500;}
.b-green{background:var(--green-bg);color:var(--green);}.b-red{background:var(--red-bg);color:var(--red);}
.t-scroll{overflow-x:auto;}
.agent-table{border-collapse:collapse;font-size:11px;width:100%;}
.agent-table th{text-align:left;padding:7px 10px;font-size:10px;font-weight:600;color:var(--ink4);border-bottom:1px solid var(--border);background:var(--surface);}
.agent-table td{padding:7px 10px;border-bottom:1px solid var(--border);}
.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.filter-label{font-size:11px;color:var(--ink4);}
.filter-select{font-size:11px;padding:5px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);font-family:inherit;cursor:pointer;}
.month-cell-wrap{min-width:52px;padding:7px 10px;border-radius:6px;display:inline-flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;user-select:none;}
.mdp-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border);font-weight:600;}
.mdp-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.mdp-metric{background:var(--bg);border-radius:var(--radius-sm);padding:10px;}
.mdp-m-lbl{font-size:10px;color:var(--ink4);margin-bottom:5px;}.mdp-m-val{font-size:18px;font-weight:700;margin-bottom:3px;}.mdp-m-tgt{font-size:10px;color:var(--ink4);margin-bottom:3px;}.mdp-m-status{font-size:10px;}
.profile-header{background:var(--ink);border-radius:var(--radius);padding:16px;margin-bottom:14px;color:white;}
.ph-name{font-size:18px;font-weight:600;margin-bottom:5px;}
.ph-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:rgba(255,255,255,.5);}
.month-track{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;}
.month-pip{font-size:10px;padding:3px 8px;border-radius:10px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);}
.month-pip.current{background:var(--brand);color:white;}
.phase-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.phase-pill{font-size:10px;padding:3px 10px;border-radius:10px;font-weight:500;}
.phase-pre{background:var(--amber-bg);color:var(--amber);}.phase-post{background:#ede9fe;color:var(--brand);}
.score-ring{width:68px;height:68px;border-radius:50%;border:3px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.score-ring-val{font-size:16px;font-weight:700;line-height:1;}.score-ring-lbl{font-size:9px;color:var(--ink4);margin-top:2px;}
.score-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.score-bar-label{font-size:10px;color:var(--ink4);width:90px;flex-shrink:0;}.score-bar-val{font-size:10px;font-weight:600;width:34px;text-align:right;flex-shrink:0;}
.quiz-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}.assess-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.quiz-cell{background:var(--bg);border-radius:6px;padding:8px;text-align:center;}
.quiz-cell-val{font-size:16px;font-weight:700;margin-bottom:2px;}.quiz-cell-lbl{font-size:9px;color:var(--ink4);}
.sh{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
.weekly-row td{padding:6px 8px;border-bottom:1px solid var(--border);}
.ag-row td{padding:7px 10px;border-bottom:1px solid var(--border);}
.agent-name-link{color:var(--brand);cursor:pointer;text-decoration:underline;font-weight:500;}
.sof-row td,.notes-row td{padding:7px 10px;border-bottom:1px solid var(--border);}
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-wrap">
    <div class="login-title">StayVista</div>
    <div class="login-sub">New Joiner Dashboard</div>
    <div class="role-tabs">
      <button class="role-tab on" onclick="setRole('agent',this)">Agent</button>
      <button class="role-tab" onclick="setRole('supervisor',this)">Supervisor</button>
      <button class="role-tab" onclick="setRole('admin',this)">Admin</button>
    </div>
    <div class="login-group on" id="agent-login">
      <label class="login-label">Your name</label>
      <select class="login-select" id="agent-select"><option value="">Select your name...</option></select>
      <label class="login-label">PIN</label>
      <input type="password" class="login-input" id="agent-pin" placeholder="Enter your 4-digit PIN" maxlength="4"/>
    </div>
    <div class="login-group" id="supervisor-login">
      <label class="login-label">Your name</label>
      <select class="login-select" id="mgr-select"><option value="">Select your name...</option></select>
      <label class="login-label">PIN</label>
      <input type="password" class="login-input" id="mgr-pin" placeholder="Enter your 4-digit PIN" maxlength="4"/>
    </div>
    <div class="login-group" id="admin-login">
      <label class="login-label">Admin PIN</label>
      <input type="password" class="login-input" id="admin-pin" placeholder="Enter admin PIN" maxlength="4"/>
    </div>
    <div id="login-err" class="login-err"></div>
    <button class="login-btn" onclick="doLogin()">Sign in</button>
  </div>
</div>
<div id="app">
  <div id="topbar">
    <div><div class="tb-logo">StayVista</div><div class="tb-sub">New Joiner Dashboard</div></div>
    <div id="nav-tabs" class="tb-nav" style="display:none">
      <button class="nav-tab" onclick="showPage('overview',this)">Overview</button>
      <button class="nav-tab" onclick="showPage('weekly',this)">Monthly Tracker</button>
      <button class="nav-tab" onclick="showPage('agents',this)">All Agents</button>
      <button class="nav-tab" onclick="showPage('attrition',this)">Attrition</button>
      <button class="nav-tab" onclick="showPage('hours',this)">Login Hours</button>
      <button class="nav-tab" onclick="showPage('sof',this)">SOF</button>
      <button class="nav-tab" onclick="showPage('notes',this)">Notes</button>
    </div>
    <div class="tb-right">
      <div class="tb-user"><div class="tb-dot"></div><span id="tb-user"></span>&nbsp;&middot;&nbsp;<span id="tb-role"></span></div>
      <button class="tb-logout" onclick="doLogout()">Sign out</button>
    </div>
  </div>
  <div id="content">
    <div class="page" id="page-self"></div>
    <div class="page" id="page-overview"></div>
    <div class="page" id="page-weekly"></div>
    <div class="page" id="page-agents"></div>
    <div class="page" id="page-attrition"></div>
    <div class="page" id="page-hours"></div>
    <div class="page" id="page-sof"></div>
    <div class="page" id="page-notes"></div>
    <div class="page" id="page-refresher"></div>
  </div>
</div>
</script>


<div id="agent-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;overflow-y:auto;padding:24px 16px" onclick="if(event.target===this)closeAgentModal()">
  <div style="max-width:820px;margin:0 auto;background:var(--surface);border-radius:12px;overflow:hidden;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);">
      <div style="font-size:13px;font-weight:600;" id="modal-title">Agent Profile</div>
      <button onclick="closeAgentModal()" style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 12px;font-size:11px;cursor:pointer;">Close</button>
    </div>
    <div id="modal-body" style="padding:20px;overflow-y:auto;max-height:calc(100vh - 100px)"></div>
  </div>
</div>

function buildSofNotesTab(active){
  var MONTHS=['2025-01','2025-02','2025-03','2025-04','2025-05','2025-06','2025-07','2025-08','2025-09','2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04','2026-05','2026-06','2026-07','2026-08','2026-09'];
  function ml2(m){var d=new Date(m+'-01');return d.toLocaleString('en',{month:'short',year:'2-digit'});}
  function pctBar(v,tgt){
    if(v==null)return '<span style="color:var(--ink4)">—</span>';
    var c=v>=tgt?'var(--green)':v>=(tgt*0.7)?'var(--amber)':'var(--red)';
    return '<span style="color:'+c+';font-weight:600">'+v.toFixed(0)+'%</span>';
  }
  var teams=Object.keys(TEAM_COLORS);
  var html='<div style="padding:16px">';
  html+='<div style="font-size:15px;font-weight:700;margin-bottom:16px">SOF & Notes — Month-wise Breakdown</div>';
  
  teams.forEach(function(team){
    var ta=active.filter(function(a){return a.team===team;});
    if(!ta.length)return;
    // Check if any agent in team has sof or notes data
    var hasSof=false,hasNotes=false;
    ta.forEach(function(a){(a.monthly||[]).forEach(function(m){if(m.sof!=null)hasSof=true;if(m.notes!=null)hasNotes=true;});});
    if(!hasSof&&!hasNotes)return;
    
    html+='<div style="margin-bottom:20px"><div style="font-weight:700;font-size:13px;margin-bottom:8px;color:var(--brand)">'+team+'</div>';
    html+='<div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:11px;width:100%">';
    html+='<thead><tr><th style="text-align:left;padding:4px 8px;background:var(--surface2);position:sticky;left:0;min-width:130px">Agent</th>';
    
    // Find months that have data
    var activeMos=MONTHS.filter(function(mo){
      return ta.some(function(a){return (a.monthly||[]).some(function(m){return m.mo===mo&&(m.sof!=null||m.notes!=null);});});
    });
    
    activeMos.forEach(function(mo){html+='<th style="padding:4px 8px;background:var(--surface2);text-align:center;min-width:80px">'+ml2(mo)+'</th>';});
    html+='</tr></thead><tbody>';
    
    // SOF rows
    if(hasSof){
      html+='<tr><td colspan="'+(activeMos.length+1)+'" style="padding:3px 8px;background:var(--surface2);font-weight:600;font-size:10px;color:var(--ink3)">SOF %</td></tr>';
      ta.forEach(function(a){
        var moMap={};(a.monthly||[]).forEach(function(m){moMap[m.mo]=m;});
        var hasAny=activeMos.some(function(mo){return moMap[mo]&&moMap[mo].sof!=null;});
        if(!hasAny)return;
        html+='<tr><td style="padding:4px 8px;border-bottom:1px solid var(--border);position:sticky;left:0;background:var(--surface)">'+a.name+'</td>';
        activeMos.forEach(function(mo){
          var v=moMap[mo]?moMap[mo].sof:null;
          html+='<td style="padding:4px 8px;text-align:center;border-bottom:1px solid var(--border)">'+pctBar(v,30)+'</td>';
        });
        html+='</tr>';
      });
    }
    
    // Notes rows
    if(hasNotes){
      html+='<tr><td colspan="'+(activeMos.length+1)+'" style="padding:3px 8px;background:var(--surface2);font-weight:600;font-size:10px;color:var(--ink3)">Bookings Notes %</td></tr>';
      ta.forEach(function(a){
        var moMap={};(a.monthly||[]).forEach(function(m){moMap[m.mo]=m;});
        var hasAny=activeMos.some(function(mo){return moMap[mo]&&moMap[mo].notes!=null;});
        if(!hasAny)return;
        html+='<tr><td style="padding:4px 8px;border-bottom:1px solid var(--border);position:sticky;left:0;background:var(--surface)">'+a.name+'</td>';
        activeMos.forEach(function(mo){
          var v=moMap[mo]?moMap[mo].notes:null;
          html+='<td style="padding:4px 8px;text-align:center;border-bottom:1px solid var(--border)">'+pctBar(v,45)+'</td>';
        });
        html+='</tr>';
      });
    }
    
    html+='</tbody></table></div></div>';
  });
  html+='</div>';
  return html;
}


function buildSofNotesCard(active){var aT=Object.keys(TEAM_COLORS);var rows=aT.map(function(team){var ta=active.filter(function(a){return a.team===team;});if(!ta.length)return '';var sv=[],nv=[];ta.forEach(function(a){(a.monthly||[]).forEach(function(m){if(m.sof!=null)sv.push(m.sof);if(m.notes!=null)nv.push(m.notes);});});if(!sv.length&&!nv.length)return '';var sa=sv.length?Math.round(sv.reduce(function(a,b){return a+b;},0)/sv.length):null;var na=nv.length?Math.round(nv.reduce(function(a,b){return a+b;},0)/nv.length):null;function barSN(v){if(v==null)return '<span style="font-size:10px;color:var(--ink4)">&mdash;</span>';var c=v>=80?'var(--green)':v>=50?'var(--amber)':'var(--red)';return '<div style="display:flex;align-items:center;gap:5px"><div style="flex:1;background:var(--bg2);border-radius:3px;height:5px;overflow:hidden"><div style="width:'+v+'%;height:100%;background:'+c+';border-radius:3px"></div></div><span style="font-size:10px;font-weight:600;color:'+c+'">'+v+'%</span></div>';}return '<div style="display:grid;grid-template-columns:110px 1fr 1fr;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bg2)"><div style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:50%;background:'+tc(team)+';flex-shrink:0"></span><span style="font-size:11px">'+team+'</span></div><div><div style="font-size:9px;color:var(--ink4);margin-bottom:2px">SOF</div>'+barSN(sa)+'</div><div><div style="font-size:9px;color:var(--ink4);margin-bottom:2px">Notes</div>'+barSN(na)+'</div></div>';}).join('');return '<div class="card"><div class="card-t" style="margin-bottom:8px">SOF &amp; Notes &mdash; Team avg (M1)</div>'+(rows?'<div>'+rows+'</div>':'<div style="font-size:11px;color:var(--ink4)">No refresher data.</div>')+'</div>';}

/* ═══ HELPERS ═══ */
function tc(t){return TEAM_COLORS[t]||'#9CA3AF';}
function ml(yymm){var p=yymm.split('-');var n=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return n[+p[1]]+" '"+p[0].slice(2);}
function ms(val,tgt,isMax){if(val===null||val===undefined)return 'pending';if(val===0&&tgt&&tgt>0)return 'fail';return isMax?(val<=tgt?'pass':'fail'):(val>=tgt?'pass':'fail');}
function mst(m){
  if(!m)return 'future';
  if(m.no_data)return 'no_data';
  if(m.peak_month)return 'peak';
  if(m.no_audit)return 'no_audit';
  var tt=m.team_type||'sales';
  var ql=ms(m.qual,m.tgt_qual);
  if(tt==='addons'){
    var nt=ms(m.notes,m.tgt_notes),ql2=m.tgt_qual!=null?ms(m.qual,m.tgt_qual):'pass';
    if(nt==='fail'||ql2==='fail')return 'fail';
    if(nt==='pass'&&ql2==='pass')return 'pass';
    if(nt==='pass'&&ql2==='pending')return 'qual_pending';
    return 'pending';
  }
  if(tt==='ivr'){
    var rv=ms(m.rev,m.rev_target_abs);
    if(rv==='fail'||ql==='fail')return 'fail';
    if(rv==='pass'&&ql==='pass')return 'pass';
    if(rv==='pass'&&ql==='pending')return 'qual_pending';
    return 'pending';
  }
  if(tt==='chat'){
    var bk=m.bookings!=null&&m.tgt_bookings!=null?(m.bookings>=m.tgt_bookings?'pass':'fail'):'pending';
    if(bk==='fail'||ql==='fail')return 'fail';
    if(bk==='pass'&&ql==='pass')return 'pass';
    if(bk==='pass'&&ql==='pending')return 'qual_pending';
    return 'pending';
  }
  // travel_agent - Revenue + CR% only (no quality tracking)
  if(tt==='travel_agent'){
    var rv=ms(m.rev,m.rev_target_abs),cr=ms(m.cr,m.tgt_cr);
    if(rv==='fail'||cr==='fail')return 'fail';
    if(rv==='pass'&&cr==='pass')return 'pass';
    return 'pending';
  }
  // fnb - CR% pending (not yet tracked), use Revenue + Quality only for now
  if(tt==='fnb'){
    var rv=ms(m.rev,m.rev_target_abs);
    if(rv==='fail'||ql==='fail')return 'fail';
    if(rv==='pass'&&ql==='pass')return 'pass';
    if(rv==='pass'&&ql==='pending')return 'qual_pending';
    return 'pending';
  }
  // sales, airbnb - Revenue + CR% + Quality
  var rv=ms(m.rev,m.rev_target_abs),cr=ms(m.cr,m.tgt_cr);
  if(rv==='fail'||cr==='fail'||ql==='fail')return 'fail';
  if(rv==='pass'&&cr==='pass'&&ql==='pass')return 'pass';
  if(rv==='pass'&&cr==='pass'&&ql==='pending')return 'qual_pending';
  return 'pending';
}
function mof(a){return a.monthsOnFloor||0;}
function scoreColor(v){return v>=80?'var(--green)':v>=60?'var(--amber)':'var(--red)';}
function hhmm(secs){var s=Math.round(secs),h=Math.floor(s/3600),m=Math.floor((s%3600)/60);if(h===0)return m+'m';if(m===0)return h+'h';return h+'h '+m+'m';}
function hhmmAvg(secs,days){if(!days||days===0)return '&mdash;';return hhmm(secs/days);}

        h+='<div style="font-size:10px;color:var(--ink4)">Peak month \u2014 quality audits paused.</div>';
      } else {h+='<div style="font-size:10px;color:var(--ink4)">'+(isFut?'Not yet reached':'No data')+'</div>';}
      h+='</div>';
    }
    h+='</div>';
    h+='<div style="display:flex;align-items:center;gap:14px;margin-bottom:8px"><div style="flex:1;background:var(--bg2);border-radius:4px;height:8px;overflow:hidden"><div style="width:'+pct2+'%;height:100%;background:'+barC+';border-radius:4px"></div></div><div style="font-size:12px;font-weight:600;white-space:nowrap">'+passed+'/'+totalM+' months achieved</div></div>';
  } else if(isSales){h+='<div style="font-size:11px;color:var(--ink4);padding:8px">Still in training \u2014 floor starts '+agent.floorStart+'.</div>';
  } else {h+='<div style="font-size:11px;color:var(--ink4);padding:8px">No monthly targets for '+agent.team+' team.</div>';}
  if(monthly.length){
    h+='<table class="agent-table" style="margin-top:8px"><thead><tr><th>Month</th><th>Revenue</th>'+(isSales?'<th>CR%</th>':'')+'<th>Quality</th>'+(agent.team==='IVR'?'<th>Calls Answered</th>':'')+'</tr></thead><tbody>';
    (function(){
      var moMap={};
      monthly.forEach(function(m){
        if(!moMap[m.mo]||(m.rev||m.queries||m.qual)>(moMap[m.mo].rev||moMap[m.mo].queries||moMap[m.mo].qual||0))
          moMap[m.mo]=m;
      });
      Object.keys(moMap).sort().forEach(function(mo){
        var m=moMap[mo];
        var qc=m.qual!=null?(m.qual>=65?'var(--green)':m.qual>=60?'var(--amber)':'var(--red)'):'';
        h+='<tr><td style="font-weight:500">'+ml(m.mo)+'</td><td>'+(m.rev!=null?'&#8377;'+m.rev.toFixed(1)+'L':'&mdash;')+'</td>'+(isSales?'<td>'+(m.cr!=null?m.cr.toFixed(1)+'%':'&mdash;')+'</td>':'')+'<td>'+(m.qual!=null?'<span style="font-weight:600;color:'+qc+'">'+m.qual.toFixed(0)+'%</span>':'&mdash;')+'</td>'+(agent.team==='IVR'?'<td>'+(m.calls!=null?m.calls.toLocaleString():'&mdash;')+'</td>':'')+'</tr>';
      });
    })();
    h+='</tbody></table>';
  }
  h+='</div>';return h;
}

/* ═══ AGENT SELF VIEW ═══ */
</script>

<script>
// ── LIVE FY27 FETCH ──────────────────────────────────────────────
(function() {
  var FY27_BASES  = [7,16,25,34,43,52];
  var FY27_MONTHS = ['2026-04','2026-05','2026-06','2026-07','2026-08','2026-09'];

  var NO_AUDIT_PASS = {
    'STA1168':['2025-04'],'STA1189':['2025-05'],'STA1204':['2025-06'],
    'STA1289':['2025-10'],'STA1488':['2026-05'],'STA1493':['2026-05'],
    'STA1521':['2026-07'],'STA1296':['2026-01'],'STA1316':['2026-01'],
    'STA1449':['2026-04'],'STA1504':['2026-06']
  };
  var QUALITY_OVERRIDES = {
    'STA1617':{'2026-08':58.0},
    'STA1432':{'2026-04':73.0,'2026-05':76.0,'2026-06':84.0},
    'STA1590':{'2026-08':72.0,'2026-09':85.0},
    'STA1114':{'2025-09':80,'2025-10':79,'2025-11':79,'2026-01':63,'2026-03':69,'2026-04':71,'2026-05':76,'2026-06':79,'2026-07':68},
    'STA1282':{'2025-10':74,'2025-11':83,'2026-01':70,'2026-03':73,'2026-04':75,'2026-05':80,'2026-06':81,'2026-07':85,'2026-08':77},
    'STA1481':{'2026-05':43,'2026-06':71,'2026-07':53,'2026-08':66},
    'STA1515':{'2026-06':53,'2026-07':63,'2026-08':54},
    'STA1360':{'2026-01':81.0},
    'STA1449':{'2026-05':87.0,'2026-06':87.0,'2026-07':87.0,'2026-08':83.0,'2026-09':85.6}
  };
  var REV_ZERO = {'STA1590':['2026-08']};
  var NAME_FIXES = {'STA1591':'Saurabh Boricha','STA1599':'Anurag Rajbhar','STA1601':'Neel Nayani','STA1606':'Vivek Singh'};
  var TEAM_OVERRIDES_LIVE = {'STA1601':'Corporate','STA1152':'North'};

  function svNum(s) {
    if (!s) return null;
    s = s.trim().replace(/%$/,'').replace(/,/g,'');
    if (['-','','NA','N/A','0','0.0'].indexOf(s) !== -1) return null;
    var f = parseFloat(s);
    return (isNaN(f) || f === 0) ? null : f;
  }

  function parseCSV(text) {
    var rows = []; var row = []; var field = ''; var inQ = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { row.push(field); field = ''; }
      else if ((c === '
' || c === '') && !inQ) {
        if (field || row.length) { row.push(field); rows.push(row); }
        field = ''; row = [];
        if (c === '' && text[i+1] === '
') i++;
      } else { field += c; }
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function getTeamType(team) {
    if (['Maharashtra','North','South','Corporate'].indexOf(team) !== -1) return 'sales';
    if (team === 'IVR') return 'ivr';
    if (['Chat','Web Chat + SM'].indexOf(team) !== -1) return 'chat';
    if (team === 'Airbnb') return 'airbnb';
    if (team === 'F&B') return 'fnb';
    if (team === 'Travel Agent') return 'travel_agent';
    if (['Addons','Add Ons','Add ons'].indexOf(team) !== -1) return 'addons';
    return null;
  }

  var MT = {
    'sales':        [{month:1,rev_pct:0.15,cr:6,qual:65},{month:2,rev_pct:0.25,cr:8,qual:70},{month:3,rev_pct:0.50,cr:10,qual:75}],
    'airbnb':       [{month:1,rev_pct:0.15,cr:6,qual:65},{month:2,rev_pct:0.25,cr:8,qual:70},{month:3,rev_pct:0.50,cr:10,qual:75}],
    'fnb':          [{month:1,rev_pct:0.15,cr:null,qual:65},{month:2,rev_pct:0.25,cr:null,qual:70},{month:3,rev_pct:0.50,cr:null,qual:75}],
    'ivr':          [{month:1,rev_pct:0.15,cr:null,qual:65},{month:2,rev_pct:0.25,cr:null,qual:70},{month:3,rev_pct:0.50,cr:null,qual:75}],
    'chat':         [{month:1,bookings:11,cr:null,qual:65},{month:2,bookings:18,cr:null,qual:70},{month:3,bookings:36,cr:null,qual:75}],
    'travel_agent': [{month:1,rev_pct:0.15,cr:50,qual:null},{month:2,rev_pct:0.25,cr:60,qual:null},{month:3,rev_pct:0.50,cr:70,qual:null}],
    'addons':       [{month:1,notes:45,qual:65},{month:2,notes:55,qual:70},{month:3,notes:65,qual:75}]
  };

  function floorStart(doj) {
    var d = new Date(doj);
    if (d.getDate() <= 15) return doj;
    var m = d.getMonth() + 2; var y = d.getFullYear();
    if (m > 12) { m = 1; y++; }
    return y + '-' + ('0'+m).slice(-2) + '-01';
  }

  function floorMonthKey(fs, n) {
    var d = new Date(fs);
    var m = d.getMonth() + n; var y = d.getFullYear() + Math.floor(m/12);
    m = m % 12; if (m === 0) { m = 12; y--; }
    return y + '-' + ('0'+m).slice(-2);
  }

  var AS_OF = new Date('2026-09-21');
  function monthsOnFloor(fs) {
    var d = new Date(fs);
    if (AS_OF < d) return 0;
    return Math.min((AS_OF.getFullYear()-d.getFullYear())*12+(AS_OF.getMonth()-d.getMonth()), 3);
  }

  function mergeAgent(existing, liveRow) {
    // liveRow: parsed CSV row for this agent
    var aid = (liveRow[0]||'').trim();
    var name = NAME_FIXES[aid] || (liveRow[1]||'').trim();
    var doj = (liveRow[2]||'').trim().replace(/\//g,'-');
    // normalise doj to YYYY-MM-DD
    if (doj && doj.match(/^\d{2}-\d{2}-\d{4}$/)) {
      var parts = doj.split('-'); doj = parts[2]+'-'+parts[1]+'-'+parts[0];
    }
    var lwd = (liveRow[3]||'').trim();
    if (lwd && lwd !== 'NA' && lwd !== '-') {
      lwd = lwd.replace(/\//g,'-');
      if (lwd.match(/^\d{2}-\d{2}-\d{4}$/)) { var p=lwd.split('-'); lwd=p[2]+'-'+p[1]+'-'+p[0]; }
    } else { lwd = null; }
    var team = TEAM_OVERRIDES_LIVE[aid] || (liveRow[4]||'').trim();
    var status = (liveRow[5]||'').trim();
    var reason = (liveRow[6]||'').trim();
    if (reason === 'NA' || reason === '-') reason = null;

    // Parse FY27 monthly data
    var moMap = {};
    FY27_MONTHS.forEach(function(mo, idx) {
      var base = FY27_BASES[idx];
      var rev_raw = svNum(liveRow[base]);
      var q_raw   = svNum(liveRow[base+1]);
      var cr_raw  = svNum(liveRow[base+2]);
      var ql_raw  = svNum(liveRow[base+3]);
      var ca_raw  = svNum(liveRow[base+4]);
      var tg_raw  = svNum(liveRow[base+5]);
      var ob_raw  = svNum(liveRow[base+6]);
      var nt_raw  = svNum(liveRow[base+7]);
      var sf_raw  = svNum(liveRow[base+8]);
      var rev  = rev_raw  ? Math.round(rev_raw/100000*100)/100 : null;
      var cr   = cr_raw   ? (cr_raw<=1?Math.round(cr_raw*10000)/100:Math.round(cr_raw*100)/100) : null;
      var qual = ql_raw   ? (ql_raw<=1?Math.round(ql_raw*10000)/100:Math.round(ql_raw*100)/100) : null;
      var tgt  = tg_raw   ? Math.round(tg_raw/100000*100)/100 : null;
      var notes= nt_raw   ? (nt_raw<=1?Math.round(nt_raw*10000)/100:Math.round(nt_raw*100)/100) : null;
      var sof  = sf_raw   ? (sf_raw<=1?Math.round(sf_raw*10000)/100:Math.round(sf_raw*100)/100) : null;
      var bk   = ob_raw   ? Math.round(ob_raw) : null;
      if (QUALITY_OVERRIDES[aid] && QUALITY_OVERRIDES[aid][mo]) qual = QUALITY_OVERRIDES[aid][mo];
      if (REV_ZERO[aid] && REV_ZERO[aid].indexOf(mo) !== -1) rev = 0;
      moMap[mo] = {mo:mo,rev:rev,queries:q_raw,cr:cr,qual:qual,calls:ca_raw,target:tgt,bookings:bk,notes:notes,sof:sof};
    });

    if (!existing) {
      // Brand new agent not in baked data
      var fs = floorStart(doj);
      var tt = getTeamType(team);
      var totalM = tt ? monthsOnFloor(fs) : 0;
      var perf = [];
      if (tt && totalM > 0) {
        var targets = MT[tt];
        for (var i = 0; i < totalM; i++) {
          var td = targets[i];
          var mo = floorMonthKey(fs, i+1);
          var rec = moMap[mo] || {};
          var isNoAudit = NO_AUDIT_PASS[aid] && NO_AUDIT_PASS[aid].indexOf(mo) !== -1;
          var qualVal = tt==='travel_agent' ? null : (isNoAudit ? null : (rec.qual||null));
          var bookings = (tt==='chat' && mo>='2026-04') ? (rec.bookings||null) : null;
          perf.push({month:i+1,calendar_mo:mo,team_type:tt,
            rev:rec.rev||null,rev_target_abs:null,rev_target_full:null,
            rev_pct:td.rev_pct||null,team_target:rec.target||null,
            avail_days:30,total_days:30,
            cr:rec.cr||null,queries:rec.queries||null,calls:rec.calls||null,
            qual:qualVal,tgt_cr:td.cr||null,tgt_qual:td.qual||null,
            tgt_bookings:td.bookings||null,bookings:bookings,
            notes:rec.notes||null,tgt_notes:td.notes||null,sof:rec.sof||null,
            behavioral:null,peak_month:mo==='2025-12',no_audit:isNoAudit,days_present:null});
        }
      }
      return {id:aid,name:name,doj:doj,floorStart:fs,monthsOnFloor:totalM,
        lwd:lwd,team:team,status:status,reason:reason,
        prehandover:{mock_calls:null,lms:null,final_score:null,quiz:{},assessments:{},handover_date:null},
        perf:perf,monthly:Object.values(moMap).sort(function(a,b){return a.mo<b.mo?-1:1;})};
    } else {
      // Merge live FY27 data into existing agent
      var ex = JSON.parse(JSON.stringify(existing));
      // Update status/lwd from sheet
      if (lwd) ex.lwd = lwd;
      ex.status = status || ex.status;
      if (reason) ex.reason = reason;
      if (TEAM_OVERRIDES_LIVE[aid]) ex.team = TEAM_OVERRIDES_LIVE[aid];

      // Merge monthly data
      var exMoMap = {};
      ex.monthly.forEach(function(m){exMoMap[m.mo]=m;});
      Object.keys(moMap).forEach(function(mo){
        var live = moMap[mo];
        if (!exMoMap[mo]) { exMoMap[mo] = live; }
        else {
          ['rev','cr','qual','queries','calls','target','bookings','notes','sof'].forEach(function(k){
            if (live[k] != null) exMoMap[mo][k] = live[k];
          });
        }
      });
      ex.monthly = Object.values(exMoMap).sort(function(a,b){return a.mo<b.mo?-1:1;});

      // Rebuild perf with updated data
      var fs = ex.floorStart; var tt = getTeamType(ex.team);
      var totalM = tt ? monthsOnFloor(fs) : 0;
      ex.monthsOnFloor = totalM;
      var perf = [];
      if (tt && totalM > 0) {
        var targets = MT[tt];
        for (var i = 0; i < totalM; i++) {
          var td = targets[i];
          var mo = floorMonthKey(fs, i+1);
          var rec = exMoMap[mo] || {};
          var isNoAudit = NO_AUDIT_PASS[aid] && NO_AUDIT_PASS[aid].indexOf(mo) !== -1;
          var qual = rec.qual || null;
          if (QUALITY_OVERRIDES[aid] && QUALITY_OVERRIDES[aid][mo]) qual = QUALITY_OVERRIDES[aid][mo];
          var qualVal = tt==='travel_agent' ? null : (isNoAudit ? null : qual);
          var bookings = (tt==='chat') ? (rec.bookings||null) : null;
          var tgt = rec.target || null;
          var rev = rec.rev != null ? rec.rev : null;
          if (REV_ZERO[aid] && REV_ZERO[aid].indexOf(mo) !== -1) rev = 0;
          var avail=30,total_d=30,rev_tgt=null,rev_tgt_full=null;
          if (tt!=='chat'&&tt!=='addons'&&tgt&&td.rev_pct){
            rev_tgt_full=Math.round(tgt*td.rev_pct*100)/100;
            rev_tgt=rev_tgt_full;
          }
          perf.push({month:i+1,calendar_mo:mo,team_type:tt,
            rev:rev,rev_target_abs:rev_tgt,rev_target_full:rev_tgt_full,
            rev_pct:td.rev_pct||null,team_target:tgt,avail_days:avail,total_days:total_d,
            cr:(rec.queries&&rec.queries>=10)?rec.cr||null:null,
            queries:rec.queries||null,calls:rec.calls||null,
            qual:qualVal,tgt_cr:td.cr||null,tgt_qual:td.qual||null,
            tgt_bookings:td.bookings||null,bookings:bookings,
            notes:rec.notes||null,tgt_notes:td.notes||null,sof:rec.sof||null,
            behavioral:null,peak_month:mo==='2025-12',no_audit:isNoAudit,days_present:null});
        }
      }
      ex.perf = perf;
      return ex;
    }
  }

  function applyLiveData(csv) {
    var rows = parseCSV(csv);
    if (rows.length < 3) return;
    // Build lookup of existing agents
    var agentMap = {};
    COHORT_DATA.forEach(function(a){ agentMap[a.id] = a; });
    var updated = {};
    for (var i = 2; i < rows.length; i++) {
      var row = rows[i];
      var aid = (row[0]||'').trim();
      if (!aid.startsWith('STA') && !aid.startsWith('SV')) continue;
      var merged = mergeAgent(agentMap[aid]||null, row);
      updated[aid] = merged;
    }
    // Replace/add in COHORT_DATA
    var seen = {};
    for (var j = 0; j < COHORT_DATA.length; j++) {
      var id = COHORT_DATA[j].id;
      if (updated[id]) { COHORT_DATA[j] = updated[id]; seen[id]=true; }
    }
    // Add brand new agents
    Object.keys(updated).forEach(function(id){
      if (!seen[id]) COHORT_DATA.push(updated[id]);
    });
    // Re-render
    if (typeof buildMgr === 'function') buildMgr();
  }

  // Show loading indicator and fetch
  window.addEventListener('DOMContentLoaded', function() {
    // Small banner while fetching
    var banner = document.createElement('div');
    banner.id = 'live-banner';
    banner.style.cssText = 'position:fixed;bottom:12px;right:12px;background:var(--brand,#6366f1);color:#fff;font-size:11px;padding:6px 12px;border-radius:6px;z-index:9999;opacity:0.9';
    banner.textContent = 'Fetching latest data…';
    document.body.appendChild(banner);

    fetch('/api/sheet')
      .then(function(r){ return r.text(); })
      .then(function(csv){
        applyLiveData(csv);
        banner.textContent = '✓ Data updated';
        banner.style.background = '#16a34a';
        setTimeout(function(){ banner.remove(); }, 2000);
      })
      .catch(function(err){
        banner.textContent = 'Live update unavailable';
        banner.style.background = '#dc2626';
        setTimeout(function(){ banner.remove(); }, 3000);
      });
  });
})();
</script>
